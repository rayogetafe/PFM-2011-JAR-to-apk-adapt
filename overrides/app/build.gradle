plugins {
    id 'com.android.application'
}

android {
    namespace 'pfm.android'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file('pfm-debug.keystore')
            storePassword 'pfmdebug'
            keyAlias 'pfmdebug'
            keyPassword 'pfmdebug'
        }
    }

    defaultConfig {
        applicationId 'pfm.android.careerlab'
        minSdk 23
        targetSdk 35
        versionCode 89
        versionName '0.84-android-port.4'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation files('libs/pfm_core_android.jar')
}
