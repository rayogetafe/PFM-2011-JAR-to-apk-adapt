name: Inspect PFM core formation internals

on:
  push:
    paths:
      - '.github/workflows/inspect-core.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build-inspect core-unpacked
          mkdir build-inspect core-unpacked
          unzip -q PFM_Android_Alpha084_port_source.zip -d build-inspect
          JAR="$PWD/build-inspect/PFM_Android_Alpha084_port/app/libs/pfm_core_android.jar"
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          (cd core-unpacked && jar xf "$JAR")
      - name: Dump tactics candidates
        shell: bash
        run: |
          set -euxo pipefail
          for cls in cp dw dz de df dg dh di dj dk dl dm dn do dp dq dr ds dt; do
            echo "===== $cls ====="
            javap -classpath "$JAR" -p -c "$cls" || true
          done
