name: Inspect PFM core formation internals

on:
  push:
    paths:
      - '.github/workflows/inspect-core.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build-inspect core-unpacked
          mkdir build-inspect core-unpacked
          unzip -q PFM_Android_Alpha084_port_source.zip -d build-inspect
          JAR="$PWD/build-inspect/PFM_Android_Alpha084_port/app/libs/pfm_core_android.jar"
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          (cd core-unpacked && jar xf "$JAR")
      - name: Find formation strings and dump candidate classes
        shell: bash
        run: |
          set -euxo pipefail
          echo '=== formation string hits ==='
          for s in '4-3-3' '4-5-1' '3-4-3' '3-5-2' '5-4-1' '5-2-3' '4-2-4' '5-3-2' '4-4-2'; do
            echo "--- $s ---"
            grep -aRIl -- "$s" core-unpacked || true
          done
          echo '=== dg ==='
          javap -classpath "$JAR" -p -c dg || true
          echo '=== classes containing 4-3-3 ==='
          while IFS= read -r f; do
            cls="${f#core-unpacked/}"
            cls="${cls%.class}"
            cls="${cls//\//.}"
            echo "===== $cls ====="
            javap -classpath "$JAR" -p -c "$cls" || true
          done < <(grep -aRIl -- '4-3-3' core-unpacked || true)
