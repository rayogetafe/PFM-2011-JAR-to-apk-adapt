name: Build standalone PFM Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PFM_Android_Alpha084_port_source.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate uploaded port source
        shell: bash
        run: |
          set -euxo pipefail
          test -f PFM_Android_Alpha084_port_source.zip
          rm -rf build-src
          mkdir build-src
          unzip -q PFM_Android_Alpha084_port_source.zip -d build-src
          PROJECT="build-src/PFM_Android_Alpha084_port"
          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/libs/pfm_core_android.jar"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          unzip -t "$PROJECT/app/libs/pfm_core_android.jar" >/dev/null

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT"
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PFM-2011-Android-Alpha084-debug
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
