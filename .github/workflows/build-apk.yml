name: Build standalone PFM Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PFM_Android_Alpha084_port_source.zip'
      - 'overrides/**'
      - 'patches/**'
      - 'signing/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate uploaded port source
        shell: bash
        run: |
          set -euxo pipefail
          test -f PFM_Android_Alpha084_port_source.zip
          rm -rf build-src
          mkdir build-src
          unzip -q PFM_Android_Alpha084_port_source.zip -d build-src
          PROJECT="build-src/PFM_Android_Alpha084_port"
          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/libs/pfm_core_android.jar"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          unzip -t "$PROJECT/app/libs/pfm_core_android.jar" >/dev/null

      - name: Apply Android native-port overrides
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d overrides/app ]; then
            cp -a overrides/app/. "$PROJECT/app/"
          fi
          GAME="$PROJECT/app/src/main/java/pfm/android/compat/lcdui/game/GameCanvas.java"
          test -f "$PROJECT/app/src/main/java/pfm/android/PfmActivity.java"
          test -f "$GAME"
          grep -q 'isDoubleBuffered()' "$GAME"
          grep -q 'showFatal' "$PROJECT/app/src/main/java/pfm/android/PfmActivity.java"

          # v14 is a regression-based repair, not another cumulative experiment.
          # Start directly from the checked-in Android compatibility layer, restore
          # the v5 timing/global-menu path that empirically handled Finalize, and
          # retain the proven popup-title exclusion for the match Options popup.
          # Intentionally DO NOT apply v9/v11/v12/v13 on top of this build.
          python3 patches/v14_restore_v5_menu_path.py "$GAME"
          grep -q 'Ordinary menus intentionally use the proven v5 global selection' "$GAME"
          grep -q 'KEY_HOLD_MS=40L' "$GAME"
          grep -q 'KEY_STEP_MS=68L' "$GAME"
          if grep -q 'directLegacyMenuSelectAndFire' "$GAME"; then
            echo 'ERROR: v13 reflection bridge leaked into v14' >&2
            exit 1
          fi

          sed -i -E 's/versionCode [0-9]+/versionCode 94/' "$PROJECT/app/build.gradle"
          sed -i -E "s/versionName '[^']+'/versionName '0.84-android-port.11-v14-regression'/" "$PROJECT/app/build.gradle"

      - name: Restore stable debug signing key
        shell: bash
        run: |
          set -euxo pipefail
          test -f signing/pfm-debug.keystore.b64
          base64 -d signing/pfm-debug.keystore.b64 > "$PROJECT/app/pfm-debug.keystore"
          test -s "$PROJECT/app/pfm-debug.keystore"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT"
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          keytool -printcert -jarfile "$APK" | grep -E 'Owner:|SHA256:' || true
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PFM-2011-Android-Alpha084-touch-v14
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
