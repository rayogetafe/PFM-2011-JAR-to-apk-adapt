name: Build standalone PFM Android APK
# v41: Chievo badge, audited 21-25 player squads, budget-neutral rebalance

on:
  workflow_dispatch:
  push:
    paths:
      - 'PFM_Android_Alpha084_port_source.zip'
      - 'overrides/**'
      - 'patches/**'
      - 'signing/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate uploaded port source
        shell: bash
        run: |
          set -euxo pipefail
          test -f PFM_Android_Alpha084_port_source.zip
          rm -rf build-src
          mkdir build-src
          unzip -q PFM_Android_Alpha084_port_source.zip -d build-src
          PROJECT="build-src/PFM_Android_Alpha084_port"
          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/libs/pfm_core_android.jar"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          unzip -t "$PROJECT/app/libs/pfm_core_android.jar" >/dev/null

      - name: Apply Android native-port overrides
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d overrides/app ]; then
            cp -a overrides/app/. "$PROJECT/app/"
          fi
          mkdir -p "$PROJECT/app/src/main/assets"
          cat "$GITHUB_WORKSPACE/overrides/badges_v40_archive/"part-* > "$PROJECT/badges-v40.tar.gz"
          tar -xzf "$PROJECT/badges-v40.tar.gz" -C "$PROJECT/app/src/main/assets"
          # Install v40's index-manifest badge set in both rendering paths:
          # Android assets power native screens; JAR resources power legacy UI.
          test "$(find "$PROJECT/app/src/main/assets/badges_v40" -type f -name '*.png' | wc -l)" -eq 118
          test "$(find "$PROJECT/app/src/main/assets/badges_v40_legacy" -type f -name '*.png' | wc -l)" -eq 118
          test "$(wc -l < "$GITHUB_WORKSPACE/overrides/badges_v40_manifest.tsv")" -eq 119
          grep -q $'^en1.png\tChelsea\tEngland/chelsea-fc.png' "$GITHUB_WORKSPACE/overrides/badges_v40_manifest.tsv"
          grep -q $'^it14.png\tChievo\tItaly/chievo-verona.png' "$GITHUB_WORKSPACE/overrides/badges_v40_manifest.tsv"
          rm -rf "$PROJECT/app/src/main/assets/badges"
          mkdir -p "$PROJECT/app/src/main/assets/badges" "$PROJECT/badge-stage/resources"
          cp "$PROJECT/app/src/main/assets/badges_v40/"*.png "$PROJECT/app/src/main/assets/badges/"
          cp "$PROJECT/app/src/main/assets/badges_v40_legacy/"*.png "$PROJECT/badge-stage/resources/"
          CORE_JAR="$(realpath "$PROJECT/app/libs/pfm_core_android.jar")"
          (cd "$PROJECT/badge-stage" && zip -q -u "$CORE_JAR" resources/*.png)
          rm -rf "$PROJECT/app/src/main/assets/badges_v40" "$PROJECT/app/src/main/assets/badges_v40_legacy"
          test "$(find "$PROJECT/app/src/main/assets/badges" -type f -name '*.png' | wc -l)" -eq 118
          GAME="$PROJECT/app/src/main/java/pfm/android/compat/lcdui/game/GameCanvas.java"
          BRIDGE="$PROJECT/app/src/main/java/PfmTouchBridge.java"
          SETTINGS_BRIDGE="$PROJECT/app/src/main/java/PfmSettingsBridge.java"
          SQUAD_BRIDGE="$PROJECT/app/src/main/java/PfmSquadBridge.java"
          SEASON_BRIDGE="$PROJECT/app/src/main/java/PfmSeasonBridge.java"
          PAUSE_BRIDGE="$PROJECT/app/src/main/java/PfmNativePauseBridge.java"
          TRANSFER_BRIDGE="$PROJECT/app/src/main/java/PfmTransferBridge.java"
          HISTORY_BRIDGE="$PROJECT/app/src/main/java/PfmHistoryBridge.java"
          MATCHDAY_BRIDGE="$PROJECT/app/src/main/java/PfmMatchdayBridge.java"
          LEAGUE_BRIDGE="$PROJECT/app/src/main/java/PfmLeagueBridge.java"
          TRANSFER_POLICY="$PROJECT/app/src/main/java/pfmTransferPolicy31.java"
          GK_STATS="$PROJECT/app/src/main/java/pfmGoalkeeperStats31.java"
          STATS_HOOK="$PROJECT/app/src/main/java/pfmStatsHook31.java"
          ROSTER_INTEGRITY="$PROJECT/app/src/main/java/pfmRosterIntegrity32.java"
          MATCH_ARCHIVE="$PROJECT/app/src/main/java/pfmLeagueMatchArchive34.java"
          MATCH_POST="$PROJECT/app/src/main/java/pfmMatchPost35.java"
          RATING_POST="$PROJECT/app/src/main/java/pfmRatingPost36.java"
          NATIVE_SETTINGS="$PROJECT/app/src/main/java/pfm/android/NativeSettings.java"
          NATIVE_SQUAD="$PROJECT/app/src/main/java/pfm/android/NativeSquad.java"
          NATIVE_POLICY="$PROJECT/app/src/main/java/pfm/android/NativeSquadPolicy.java"
          NATIVE_ANALYTICS="$PROJECT/app/src/main/java/pfm/android/NativeTeamAnalytics.java"
          NATIVE_PLAYER_CAREER="$PROJECT/app/src/main/java/pfm/android/NativePlayerCareer.java"
          NATIVE_LINEUP="$PROJECT/app/src/main/java/pfm/android/NativeLineup.java"
          NATIVE_SEASON="$PROJECT/app/src/main/java/pfm/android/NativeSeasonHub.java"
          NATIVE_TRANSFERS="$PROJECT/app/src/main/java/pfm/android/NativeTransfers.java"
          NATIVE_HISTORY="$PROJECT/app/src/main/java/pfm/android/NativeHistory.java"
          NATIVE_MATCHDAY="$PROJECT/app/src/main/java/pfm/android/NativeMatchday.java"
          NATIVE_LEAGUE="$PROJECT/app/src/main/java/pfm/android/NativeLeagueCenter.java"
          NATIVE_PAUSE="$PROJECT/app/src/main/java/pfm/android/NativePause.java"
          DISPLAY="$PROJECT/app/src/main/java/pfm/android/compat/lcdui/Display.java"
          test -f "$PROJECT/app/src/main/java/pfm/android/PfmActivity.java"
          test -f "$GAME"
          test -f "$BRIDGE"
          test -f "$SETTINGS_BRIDGE"
          test -f "$SQUAD_BRIDGE"
          test -f "$SEASON_BRIDGE"
          test -f "$PAUSE_BRIDGE"
          test -f "$TRANSFER_BRIDGE"
          test -f "$HISTORY_BRIDGE"
          test -f "$MATCHDAY_BRIDGE"
          test -f "$LEAGUE_BRIDGE"
          test -f "$TRANSFER_POLICY"
          test -f "$GK_STATS"
          test -f "$STATS_HOOK"
          test -f "$NATIVE_SETTINGS"
          test -f "$NATIVE_SQUAD"
          test -f "$NATIVE_POLICY"
          test -f "$NATIVE_ANALYTICS"
          test -f "$NATIVE_PLAYER_CAREER"
          test -f "$NATIVE_LINEUP"
          test -f "$NATIVE_SEASON"
          test -f "$NATIVE_TRANSFERS"
          test -f "$NATIVE_HISTORY"
          test -f "$NATIVE_MATCHDAY"
          test -f "$NATIVE_LEAGUE"
          test -f "$NATIVE_PAUSE"
          test -f "$DISPLAY"
          grep -q 'isDoubleBuffered()' "$GAME"
          grep -q 'showFatal' "$PROJECT/app/src/main/java/pfm/android/PfmActivity.java"
          grep -q 'tapActiveMenu' "$BRIDGE"
          grep -q 'openPlayersMenuItem' "$BRIDGE"
          grep -q 'pfmNavigateAndFire' "$GAME"
          grep -q 'VISUAL_SELECTION_DELAY_MS' "$BRIDGE"
          grep -q 'setAutoRotation' "$SETTINGS_BRIDGE"
          grep -q 'Auto rotation' "$NATIVE_SETTINGS"
          grep -q 'Career transfer frequency' "$NATIVE_SETTINGS"
          grep -q 'SEASON MODE — transfers are disabled' "$NATIVE_SETTINGS"
          grep -q 'PfmSquadBridge' "$NATIVE_SQUAD"
          grep -q 'LINE-UP / TACTICS' "$NATIVE_SQUAD"
          grep -q 'NativeLineup.show' "$NATIVE_SQUAD"
          grep -q 'season.setText("SEASON")' "$NATIVE_SQUAD"
          grep -q 'NativeSeasonHub.show' "$NATIVE_SQUAD"
          grep -q 'NativeSquadPolicy.show' "$NATIVE_SQUAD"
          grep -q 'NativeTeamAnalytics.show' "$NATIVE_SQUAD"
          grep -q 'NativePlayerCareer.show' "$NATIVE_SQUAD"
          grep -q 'TOP SCORERS' "$NATIVE_ANALYTICS"
          grep -q 'SQUAD DEPTH' "$NATIVE_ANALYTICS"
          grep -q 'Career totals' "$NATIVE_PLAYER_CAREER"
          grep -q 'Attribute change' "$NATIVE_PLAYER_CAREER"
          grep -q 'Players used in starting XI' "$NATIVE_POLICY"
          grep -q 'playedMatches' "$NATIVE_POLICY"
          grep -q 'stat integrity' "$NATIVE_POLICY"
          grep -q 'AUTO ROTATION' "$NATIVE_POLICY"
          grep -q 'NativePause.begin' "$NATIVE_SQUAD"
          grep -q 'NativePause.begin' "$NATIVE_LINEUP"
          grep -q 'marketRows' "$TRANSFER_BRIDGE"
          grep -q 'openPlayersMenuItem' "$TRANSFER_BRIDGE"
          grep -q 'experimental native transfer' "$NATIVE_TRANSFERS"
          grep -q 'original New players menu' "$NATIVE_TRANSFERS"
          grep -q 'PfmHistoryBridge' "$NATIVE_HISTORY"
          grep -q 'FINAL TABLE' "$NATIVE_HISTORY"
          grep -q 'SQUAD STATS' "$NATIVE_HISTORY"
          grep -q 'leagueCode' "$SEASON_BRIDGE"
          grep -q 'CHAMPIONS LEAGUE' "$NATIVE_SEASON"
          grep -q 'NativeHistory.show' "$NATIVE_SEASON"
          grep -q 'NativeLeagueCenter.show' "$NATIVE_SEASON"
          grep -q 'real 2010/11 target' "$NATIVE_LEAGUE"
          grep -q 'GK ledger:' "$NATIVE_LEAGUE"
          grep -q 'PfmSeasonBridge.teamName' "$HISTORY_BRIDGE"
          grep -q 'teamId(r.n)' "$HISTORY_BRIDGE"
          grep -q 'CHAMPIONS LEAGUE' "$NATIVE_HISTORY"
          grep -q 'zoneColor' "$NATIVE_HISTORY"
          grep -q 'substitutionPlan' "$MATCHDAY_BRIDGE"
          grep -q 'eventRecords' "$MATCHDAY_BRIDGE"
          grep -q 'MATCH "+p\[3\]' "$MATCHDAY_BRIDGE"
          grep -q 'reportSummary' "$NATIVE_MATCHDAY"
          grep -q 'AUTO SUBS' "$NATIVE_MATCHDAY"
          grep -q 'MATCHDAY' "$NATIVE_SQUAD"
          grep -q 'swapLineupPositions' "$SQUAD_BRIDGE"
          grep -q 'formationIndex' "$SQUAD_BRIDGE"
          grep -q 'setFormationIndex' "$SQUAD_BRIDGE"
          grep -q 'liveMatchActive' "$SQUAD_BRIDGE"
          grep -q 'current instanceof ca' "$SQUAD_BRIDGE"
          grep -q 'field(dw.class,"d",Byte.TYPE)' "$SQUAD_BRIDGE"
          grep -q 'STARTING XI' "$NATIVE_LINEUP"
          grep -q 'BENCH / RESERVES' "$NATIVE_LINEUP"
          grep -q 'UNDO SWAP' "$NATIVE_LINEUP"
          grep -q 'FORMATION:' "$NATIVE_LINEUP"
          grep -q '4-4-2' "$NATIVE_LINEUP"
          grep -q 'pfmCondition60' "$SQUAD_BRIDGE"
          grep -q 'pfmDiscipline70' "$SQUAD_BRIDGE"
          grep -q 'ratingMatches' "$SQUAD_BRIDGE"
          grep -q 'tableRows' "$SEASON_BRIDGE"
          grep -q 'scheduleRows' "$SEASON_BRIDGE"
          grep -q 'pfmPlayedForTable' "$SEASON_BRIDGE"
          grep -q 'TABLE' "$NATIVE_SEASON"
          grep -q 'SCHEDULE' "$NATIVE_SEASON"
          grep -q 'NEXT MATCH' "$NATIVE_SEASON"
          grep -q 'NativeSettings.show' "$DISPLAY"
          grep -q 'NativeSquad.show' "$DISPLAY"

          # Keep the proven v16/v17 touch path unchanged.
          python3 patches/v9_frame_sync.py "$GAME"
          grep -q 'pumpSyntheticFrame' "$GAME"
          grep -q 'syntheticQueue' "$GAME"

          python3 patches/v14_restore_v5_menu_path.py "$GAME"
          grep -q 'Ordinary menus intentionally use the proven v5 global selection' "$GAME"

          python3 patches/v15_frame_synced_menu_input.py "$GAME"
          grep -q 'syntheticGapFrames=4' "$GAME"
          grep -q 'syntheticSequenceActive()' "$GAME"

          python3 patches/v16_active_menu_bridge.py "$GAME"
          grep -q 'handleCoreMenuTap' "$GAME"
          grep -q 'PfmTouchBridge' "$GAME"

          # v27 widens seasonal rotation while preserving the existing
          # deterministic fatigue/injury/substitution engine.
          python3 patches/v27_rotation.py "$PROJECT/app/libs/pfm_core_android.jar"
          python3 patches/v28_sub_frequency.py "$PROJECT/app/libs/pfm_core_android.jar"
          grep -q 'base selection chance 52->64' patches/v28_sub_frequency.py
          python3 patches/v31_policy_stats_hooks.py "$PROJECT/app/libs/pfm_core_android.jar"
          grep -q 'rollForMarket' patches/v31_policy_stats_hooks.py
          test -s "$ROSTER_INTEGRITY"
          test -s "$MATCH_ARCHIVE"
          test -s "$MATCH_POST"
          test -s "$RATING_POST"
          grep -q 'repairAll' "$ROSTER_INTEGRITY"
          grep -q 'runStockMarketTick' "$TRANSFER_POLICY"
          grep -q 'snapshotRound' "$GK_STATS"
          grep -q 'pfmRosterIntegrity32.repairAll' "$STATS_HOOK"
          python3 patches/v32_transfer_integrity.py "$PROJECT/app/libs/pfm_core_android.jar"
          grep -q 'runStockMarketTick' patches/v32_transfer_integrity.py
          python3 patches/v33_market_gateway.py "$PROJECT/app/libs/pfm_core_android.jar"
          grep -q 'winter and summer calls share' patches/v33_market_gateway.py
          python3 patches/v34_match_archive.py "$PROJECT/app/libs/pfm_core_android.jar"
          grep -q 'exact fixture lineups' patches/v34_match_archive.py
          python3 patches/v35_match_post.py "$PROJECT/app/libs/pfm_core_android.jar"
          grep -q 'assists and discipline archived' patches/v35_match_post.py
          python3 patches/v36_same_round_discipline.py "$PROJECT/app/libs/pfm_core_android.jar"
          grep -q 'completed live round' patches/v36_same_round_discipline.py
          grep -q 'completedRoundOne' "$MATCH_POST"
          python3 patches/v38_sub_timing.py "$PROJECT/app/libs/pfm_core_android.jar"
          grep -q 'pfmSubTiming38' patches/v38_sub_timing.py
          python3 patches/v40_roster_depth.py "$PROJECT/app/libs/pfm_core_android.jar"
          grep -q '36 historical wide/second forwards' patches/v40_roster_depth.py
          cp "$PROJECT/app/libs/pfm_core_android.jar" "$PROJECT/v41-base.jar"
          python3 patches/v41_roster_expansion.py "$PROJECT/app/libs/pfm_core_android.jar" overrides/roster_v41_plan.json
          grep -q '21-25 owned players' patches/v41_roster_expansion.py
          python3 tools/audit_v41_build.py "$PROJECT/v41-base.jar" "$PROJECT/app/libs/pfm_core_android.jar" overrides/roster_v41_plan.json
          python3 tools/build_v42_world_asset.py "$PROJECT/app/libs/pfm_core_android.jar" overrides/nationalities_v42.tsv "$PROJECT/app/src/main/assets/world_v42.tsv"
          python3 tools/audit_v44_world_sim.py "$PROJECT/app/src/main/assets/world_v42.tsv"
          python3 tools/audit_v48_world_rotation.py "$PROJECT/app/src/main/assets/world_v42.tsv"
          python3 tools/audit_v50_market_economy.py "$PROJECT/app/src/main/assets/world_v42.tsv"
          mkdir -p "$PROJECT/v42-stage/resources"
          cp overrides/nationalities_v42.tsv "$PROJECT/v42-stage/resources/nationalities_v42.tsv"
          (cd "$PROJECT/v42-stage" && zip -q -u "$CORE_JAR" resources/nationalities_v42.tsv)
          test "$(wc -l < overrides/nationalities_v42.tsv)" -eq 2282
          test "$(grep -c $'^P\t' "$PROJECT/app/src/main/assets/world_v42.tsv")" -eq 2281
          test -s "$PROJECT/app/src/main/java/pfm/android/NativeWorldCenter.java"
          test -s "$PROJECT/app/src/main/java/pfm/android/NativeWorldCompetition.java"
          test -s "$PROJECT/app/src/main/java/pfm/android/NativeGlobalMarket.java"
          grep -q 'Pure-data port of bb.c(dw)' "$PROJECT/app/src/main/java/pfm/android/NativeWorldCenter.java"
          grep -q 'static int attackPct' "$PROJECT/app/src/main/java/pfm/android/NativeWorldCenter.java"
          grep -q 'static int tempo' "$PROJECT/app/src/main/java/pfm/android/NativeWorldCenter.java"
          grep -q $'morale\tstyle\tformation\tvalue\twage' "$PROJECT/app/src/main/assets/world_v42.tsv"
          grep -q 'GLOBAL PLAYER MARKET' "$PROJECT/app/src/main/java/pfm/android/NativeWorldCompetition.java"
          grep -q 'before cross-league transactions' "$PROJECT/app/src/main/java/pfm/android/NativeGlobalMarket.java"
          grep -q 'pfm_global_shortlist' "$PROJECT/app/src/main/java/pfm/android/NativeGlobalMarket.java"
          grep -q 'Estimated asking price' "$PROJECT/app/src/main/java/pfm/android/NativeGlobalMarket.java"
          grep -q 'int\[\] result=score(code,seed,h,a,hs,as)' "$PROJECT/app/src/main/java/pfm/android/NativeWorldCenter.java"
          grep -q 'pfm_world_careers' "$PROJECT/app/src/main/java/pfm/android/NativeWorldCenter.java"
          grep -q 'ArrayAdapter<NativeWorldCenter.T>' "$PROJECT/app/src/main/java/pfm/android/NativeWorldCompetition.java"
          ! grep -q 'ArrayAdapter<View>' "$PROJECT/app/src/main/java/pfm/android/NativeWorldCompetition.java"
          test -s "$PROJECT/app/src/main/java/pfmNationality42.java"
          test -s "$PROJECT/app/src/main/java/pfmSubTiming38.java"
          grep -q 'suspensionSnapshot' "$MATCH_POST"
          grep -q 'ratingSum10' "$RATING_POST"
          grep -q 'v39 calibrated coherent match flow' "$MATCH_ARCHIVE"
          grep -q 'goal-minute eligible draw' "$MATCH_ARCHIVE"
          grep -q 'score and tactical noise' "$MATCH_ARCHIVE"
          grep -q 'BitmapFactory' "$NATIVE_LEAGUE"
          grep -q 'SUBSTITUTES USED' "$NATIVE_LEAGUE"
          grep -q 'MATCH STATISTICS' "$NATIVE_LEAGUE"
          grep -q 'Open club' "$NATIVE_LEAGUE"
          grep -q 'leaguePlayerRows' "$LEAGUE_BRIDGE"
          grep -q 'rosterAudit' "$LEAGUE_BRIDGE"
          grep -q 'Player or club name' "$NATIVE_LEAGUE"
          grep -q 'matchReport' "$LEAGUE_BRIDGE"
          grep -q 'snapshotAfterLoad' "$TRANSFER_POLICY"

          if grep -q 'directLegacyMenuSelectAndFire' "$GAME"; then
            echo 'ERROR: old v13 ambiguous reflection bridge leaked into v23' >&2
            exit 1
          fi

          sed -i -E 's/versionCode [0-9]+/versionCode 130/' "$PROJECT/app/build.gradle"
          sed -i -E "s/versionName '[^']+'/versionName '0.84-android-port.38-v50-market-economy-shortlist'/" "$PROJECT/app/build.gradle"

      - name: Restore stable debug signing key
        shell: bash
        run: |
          set -euxo pipefail
          test -f signing/pfm-debug.keystore.b64
          base64 -d signing/pfm-debug.keystore.b64 > "$PROJECT/app/pfm-debug.keystore"
          test -s "$PROJECT/app/pfm-debug.keystore"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android platform/build tools
        shell: bash
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT"
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          keytool -printcert -jarfile "$APK" | grep -E 'Owner:|SHA256:' || true
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PFM-2011-Android-Alpha084-v50-market-economy-shortlist
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
