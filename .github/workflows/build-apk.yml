name: Build standalone PFM Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PFM_Android_Alpha084_port_source.zip'
      - 'overrides/**'
      - 'patches/**'
      - 'signing/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate uploaded port source
        shell: bash
        run: |
          set -euxo pipefail
          test -f PFM_Android_Alpha084_port_source.zip
          rm -rf build-src
          mkdir build-src
          unzip -q PFM_Android_Alpha084_port_source.zip -d build-src
          PROJECT="build-src/PFM_Android_Alpha084_port"
          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/libs/pfm_core_android.jar"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          unzip -t "$PROJECT/app/libs/pfm_core_android.jar" >/dev/null

      - name: Apply Android native-port overrides
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d overrides/app ]; then
            cp -a overrides/app/. "$PROJECT/app/"
          fi
          test -f "$PROJECT/app/src/main/java/pfm/android/PfmActivity.java"
          test -f "$PROJECT/app/src/main/java/pfm/android/compat/lcdui/game/GameCanvas.java"
          grep -q 'isDoubleBuffered()' "$PROJECT/app/src/main/java/pfm/android/compat/lcdui/game/GameCanvas.java"
          grep -q 'showFatal' "$PROJECT/app/src/main/java/pfm/android/PfmActivity.java"

          # Keep the wider grouping tolerance from v8 and the v9 synthetic-key
          # sequencer, then apply the fixes derived from on-device diagnostics.
          sed -i 's/Math.abs(xe\[i\]-xe\[target\])>18/Math.abs(xe[i]-xe[target])>42/g' "$PROJECT/app/src/main/java/pfm/android/compat/lcdui/game/GameCanvas.java"
          sed -i 's/Math.abs((xe\[i\]-xs\[i\])-(xe\[target\]-xs\[target\]))>24/Math.abs((xe[i]-xs[i])-(xe[target]-xs[target]))>46/g' "$PROJECT/app/src/main/java/pfm/android/compat/lcdui/game/GameCanvas.java"
          python3 patches/v9_frame_sync.py "$PROJECT/app/src/main/java/pfm/android/compat/lcdui/game/GameCanvas.java"
          grep -q 'pumpSyntheticFrame' "$PROJECT/app/src/main/java/pfm/android/compat/lcdui/game/GameCanvas.java"

          # v11: exclude compact popup title rows.
          python3 patches/v11_menu_fix.py "$PROJECT/app/src/main/java/pfm/android/compat/lcdui/game/GameCanvas.java"
          grep -q 'menuFirst=first' "$PROJECT/app/src/main/java/pfm/android/compat/lcdui/game/GameCanvas.java"

          # v12: preserve the generous hit zone for bottom-most items.
          python3 patches/v12_bottom_menu_fix.py "$PROJECT/app/src/main/java/pfm/android/compat/lcdui/game/GameCanvas.java"
          grep -q 'hitBottom=' "$PROJECT/app/src/main/java/pfm/android/compat/lcdui/game/GameCanvas.java"

          # v13: stop emulating directional navigation for taps. Resolve the
          # active legacy v menu controller, call its own e(index) selection
          # setter directly, then send only FIRE.
          python3 patches/v13_direct_menu_select.py "$PROJECT/app/src/main/java/pfm/android/compat/lcdui/game/GameCanvas.java"
          grep -q 'directLegacyMenuSelectAndFire' "$PROJECT/app/src/main/java/pfm/android/compat/lcdui/game/GameCanvas.java"

          sed -i -E 's/versionCode [0-9]+/versionCode 93/' "$PROJECT/app/build.gradle"
          sed -i -E "s/versionName '[^']+'/versionName '0.84-android-port.10'/" "$PROJECT/app/build.gradle"

      - name: Restore stable debug signing key
        shell: bash
        run: |
          set -euxo pipefail
          test -f signing/pfm-debug.keystore.b64
          base64 -d signing/pfm-debug.keystore.b64 > "$PROJECT/app/pfm-debug.keystore"
          test -s "$PROJECT/app/pfm-debug.keystore"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT"
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          keytool -printcert -jarfile "$APK" | grep -E 'Owner:|SHA256:' || true
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PFM-2011-Android-Alpha084-touch-v13
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
