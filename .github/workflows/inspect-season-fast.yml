name: Fast inspect PFM season core

on:
  push:
    paths:
      - '.github/workflows/inspect-season-fast.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump season core
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-inspect && mkdir build-inspect
          unzip -q PFM_Android_Alpha084_port_source.zip -d build-inspect
          JAR="$PWD/build-inspect/PFM_Android_Alpha084_port/app/libs/pfm_core_android.jar"
          for cls in cp dw ca du bb bc bd be bf bg bh bi bj bk bl bm bn bo bp bq br bs bt bu bv bw bx by bz; do
            echo "===== $cls ====="
            javap -classpath "$JAR" -p "$cls" | head -180 || true
          done
